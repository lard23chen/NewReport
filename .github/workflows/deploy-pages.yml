name: Deploy HTML to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare Pages content
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="${RUNNER_TEMP}/pages"
          mkdir -p "$PUBLISH_DIR"

          while IFS= read -r -d '' FILE; do
            RELATIVE_PATH="${FILE#./}"
            mkdir -p "${PUBLISH_DIR}/$(dirname "$RELATIVE_PATH")"
            cp -- "$FILE" "${PUBLISH_DIR}/${RELATIVE_PATH}"
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          test -f "${PUBLISH_DIR}/HTML_Report_Catalog.html" || {
            echo "HTML_Report_Catalog.html was not found." >&2
            exit 1
          }

          touch "${PUBLISH_DIR}/.nojekyll"
          echo "PUBLISH_DIR=${PUBLISH_DIR}" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
